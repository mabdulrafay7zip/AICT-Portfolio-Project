<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Contact Me</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #111010 0%, #1e1e1e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Ornaments */
        body::before,
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            z-index: -1;
            filter: blur(100px);
        }

        body::before {
            background: rgba(255, 0, 0, 0.2);
            top: -100px;
            left: -100px;
            animation: float 10s infinite alternate;
        }

        body::after {
            background: rgba(0, 255, 255, 0.2);
            bottom: -100px;
            right: -100px;
            animation: float 8s infinite alternate-reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .glass-form {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .glass-form:hover {
            transform: translateY(-5px);
        }

        legend {
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #ff0000, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .form-label {
            font-weight: 500;
            margin-left: 0.5rem;
            font-size: 0.9rem;
            color: #ccc;
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00ffff;
            box-shadow: 0 0 0 0.2rem rgba(0, 255, 255, 0.25);
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .form-check-input:checked {
            background-color: #ff0000;
            border-color: #ff0000;
        }

        .btn-premium {
            background: linear-gradient(135deg, #ff0000 0%, #00ffff 100%);
            border: none;
            border-radius: 10px;
            padding: 0.8rem 2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3);
            color: #000;
            /* Dark text usually looks better on bright cyan/red */
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.5);
            background: linear-gradient(135deg, #00ffff 0%, #ff0000 100%);
            color: #000;
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .glass-form {
                padding: 2rem;
                margin: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="glass-form">
        <form>
            <legend>Get in Touch</legend>
            <div class="mb-4">
                <label for="nameInput" class="form-label">Full Name</label>
                <input type="text" id="nameInput" class="form-control" placeholder="John Doe">
            </div>
            <div class="mb-4">
                <label for="emailInput" class="form-label">Email Address</label>
                <input type="email" id="emailInput" class="form-control" placeholder="name@example.com">
            </div>
            <div class="mb-4">
                <label for="subjectSelect" class="form-label">Subject</label>
                <select id="subjectSelect" class="form-select">
                    <option selected disabled>Choose a topic...</option>
                    <option value="1">General Inquiry</option>
                    <option value="2">Project Proposal</option>
                    <option value="3">Feedback</option>
                </select>
            </div>
            <div class="mb-4">
                <label for="messageInput" class="form-label">Message</label>
                <textarea class="form-control" id="messageInput" rows="4" placeholder="Your message here..."></textarea>
            </div>
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="newsletterCheck">
                <label class="form-check-label text-white-50" for="newsletterCheck">
                    Subscribe to newsletter
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-premium">Send Message</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
